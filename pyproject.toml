[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maze-runner"
version = "2026.1.0"
description = "Maze pathfinding (wall followers, BFS, A*) run sequentially, with multiprocessing, MPI and Celery."
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{ name = "Maryam Mahaboob" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "mpi: needs mpiexec and mpi4py",
    "celery: needs a reachable RabbitMQ broker",
    "slow: takes more than a few seconds",
]

[tool.coverage.run]
source = ["maze_runner"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff.lint.per-file-ignores]
# Supplied modules: keep their original style so the diff against the supplied version stays small.
"src/maze_runner/explorer.py" = ["UP006", "UP035", "F401", "F841", "I001"]
