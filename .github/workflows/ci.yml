name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test-linux:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          # throwaway login for this CI container only (guest is refused from outside it)
          RABBITMQ_DEFAULT_USER: maze
          RABBITMQ_DEFAULT_PASS: maze
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 10s --health-retries 20
    env:
      CELERY_BROKER_URL: pyamqp://maze:maze@localhost:5672//
      MPIEXEC_FLAGS: --oversubscribe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Open MPI
        run: sudo apt-get update && sudo apt-get install -y openmpi-bin libopenmpi-dev
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit, property, regression, integration and README command tests with coverage
        run: python -m pytest --cov=maze_runner --cov-report=term --cov-fail-under=85
      - name: Whole suite again with multiprocessing forced to spawn
        run: python -m pytest -q
        env:
          MAZE_MP_START_METHOD: spawn
      - name: README numbers match results/
        run: python scripts/check_readme_claims.py

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests (spawn is the only start method on Windows; MPI and Celery integration skip)
        run: python -m pytest -rs

  pii-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Secrets and personal data in tracked files and every commit
        run: python scripts/pii_scan.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose -f docker/docker-compose.yml build
      - name: RabbitMQ + worker + client until the client exits
        run: |
          mkdir -p results/docker && chmod 777 results/docker
          HOST_UID=$(id -u) docker compose -f docker/docker-compose.yml up \
            --abort-on-container-exit --exit-code-from client
      - name: Client wrote its results
        run: |
          test -s results/docker/celery_docker_static.json
          test -s results/docker/celery_docker_random300.json
      - if: always()
        run: docker compose -f docker/docker-compose.yml down -v
